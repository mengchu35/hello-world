<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>儀表板</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: linear-gradient(160deg, #0f172a 0%, #1e293b 55%, #0f172a 100%);
        color: #f8fafc;
      }

      main {
        width: min(100% - 2rem, 26rem);
        padding: 1.75rem 1.5rem;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.35);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 0 0 0.65rem;
        font-size: 1.35rem;
        font-weight: 600;
      }

      p {
        margin: 0 0 1rem;
        line-height: 1.5;
        color: #cbd5e1;
        font-size: 0.95rem;
      }

      .welcome {
        color: #e2e8f0;
        font-weight: 500;
      }

      a.logout {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 0.65rem 0.85rem;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        color: #0f172a;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
      }

      a.logout:hover {
        filter: brightness(1.06);
      }

      a.logout:focus-visible {
        outline: 2px solid #e2e8f0;
        outline-offset: 2px;
      }

      footer {
        margin-top: 1rem;
        font-size: 0.72rem;
        line-height: 1.35;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>儀表板</h1>
      <p id="greeting"></p>
      <p class="welcome">你已自登入頁進入示範儀表板。</p>
      <a class="logout" href="login.html" id="logout">返回登入</a>
      <footer>
        僅為前端示意：重新整理仍可留在本頁。重新登入將覆寫顯示名稱。正式環境請使用伺服器 Session
        或權杖驗證。
      </footer>
    </main>
    <script>
      (function () {
        var STORAGE_KEY = "demoLoggedInUser";
        var user = sessionStorage.getItem(STORAGE_KEY);
        if (!user) {
          window.location.replace("login.html");
          return;
        }
        document.getElementById("greeting").textContent =
          "歡迎回來，" + user + "。";
        document.getElementById("logout").addEventListener("click", function () {
          sessionStorage.removeItem(STORAGE_KEY);
        });
      })();
    </script>
  </body>
</html>
